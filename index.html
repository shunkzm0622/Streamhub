<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Streamhub · Tra cứu IPTV</title><style>*{box-sizing:border-box}body{margin:0;background:#101820;color:#ecf4f5;font:16px Inter,system-ui,sans-serif}main{max-width:1060px;margin:auto;padding:48px 5%}h1{font-size:clamp(36px,7vw,72px);margin:0;color:#8cf4ce}header{margin:36px 0 20px;display:flex;gap:10px;flex-wrap:wrap}input,select,button{padding:12px;border:1px solid #557070;border-radius:8px;background:#192930;color:inherit;font:inherit}input{flex:1;min-width:180px}article{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #35464c;padding:14px 0;gap:14px}small{display:block;color:#abc8bd;margin-top:4px}button{cursor:pointer}button:hover{background:#245147}</style><main><h1>Streamhub</h1><p>Tra cứu URL stream từ hai playlist IPTV.</p><header><input id="q" aria-label="Tìm kênh" placeholder="Tìm kênh hoặc chương trình"><select id="src" aria-label="Nguồn playlist"><option value="">Tất cả nguồn</option><option>File (7)</option><option>File (8)</option><option>Cả hai</option></select></header><p id="count" role="status">Đang tải…</p><section id="list"></section></main><script>
let rows=[];function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replaceAll('đ','d')}function render(){list.replaceChildren();let n=0;for(const [url,source,name] of rows){if(src.value&&src.value!==source||!norm(name).includes(norm(q.value)))continue;n++;let a=document.createElement('article'),d=document.createElement('div'),s=document.createElement('small'),b=document.createElement('button');d.textContent=name||'Chưa có tên';s.textContent=source+' · '+new URL(url).hostname;d.append(s);b.textContent='Sao chép URL';b.onclick=async()=>{try{await navigator.clipboard.writeText(url);b.textContent='Đã sao chép'}catch{prompt('Sao chép URL',url)}};a.append(d,b);list.append(a)}count.textContent=n+' / '+rows.length+' URL'}q.oninput=src.onchange=render;fetch('./channels.json').then(r=>r.json()).then(v=>{rows=v;render()}).catch(()=>count.textContent='Không tải được danh sách.');</script></html>
