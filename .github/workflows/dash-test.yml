name: Test DASH playback on iPhone Simulator
on:
  push:
    branches: [test-dash-web-origin]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Bundle MPEG-DASH player for IPA and web updates
        run: |
          npm pack --ignore-scripts dashjs@5.3.0 --pack-destination "$RUNNER_TEMP"
          tar -xOf "$RUNNER_TEMP/dashjs-5.3.0.tgz" package/dist/modern/umd/dash.all.min.js > "$RUNNER_TEMP/dash-player.js"
          node --check "$RUNNER_TEMP/dash-player.js"
          python3 - <<'PY'
          import base64, os, pathlib
          html = pathlib.Path("App/Web/index.html")
          source = html.read_text()
          url = "https://cdn.jsdelivr.net/npm/dashjs@5.3.0/dist/modern/umd/dash.all.min.js"
          assert source.count(url) == 1
          player = (pathlib.Path(os.environ["RUNNER_TEMP"]) / "dash-player.js").read_bytes()
          assert len(player) > 100000
          html.write_text(source.replace(url, "data:text/javascript;base64," + base64.b64encode(player).decode()))
          PY
      - name: Test actual video frame in WKWebView
        run: |
          set -euo pipefail
          id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for ds in reversed(list(json.load(sys.stdin)["devices"].values())) for d in ds if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$id"
          xcrun simctl bootstatus "$id" -b
          xcrun simctl getenv "$id" SIMULATOR_RUNTIME_VERSION || true
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path("App/App.swift")
          p.write_text(p.read_text().replace('web.loadFileURL(entry, allowingReadAccessTo: entry.deletingLastPathComponent())', '''let html = (try! String(contentsOf: entry)).replacingOccurrences(of: "channels.js", with: "data:text/javascript,window.bundledChannels=%5B%5D")
                  web.loadSimulatedRequest(URLRequest(url: URL(string: "https://shun-player.invalid/index.html")!), responseHTMLString: html)''').replace('let external =', '''if url.host == "shun-player.invalid" { decisionHandler(.allow); return }
                  let external ='''))
          p.write_text(p.read_text().replace('config.userContentController.add(self, name: "exportChannels")','config.userContentController.add(self, name: "testDash")\n        config.userContentController.add(self, name: "exportChannels")').replace('        if message.name == "checkUpdate"', '''        if message.name == "testDash", let body = message.body as? String {
                      let docs = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0]
                      try? body.write(to: docs.appendingPathComponent("dash-test.json"), atomically: true, encoding: .utf8)
                      return
                  }
                  if message.name == "checkUpdate"'''))
          p=pathlib.Path("App/Web/channels.js"); p.write_text('window.bundledChannels=[];')
          p=pathlib.Path("App/Web/index.html")
          s=p.read_text().replace('loadGithubDefault();', '''loadGithubDefault();
          setTimeout(() => {
            const url="https://dash.akamaized.net/akamai/bbb_30fps/bbb_30fps.mpd";
            $("playlistUrl").value=url; $("urlMode").value="stream"; $("importUrlBtn").click();
            setTimeout(() => $("channelsList").querySelector(".channel")?.click(),500);
            setInterval(() => {
              const v=$("video");
              window.webkit.messageHandlers.testDash.postMessage(JSON.stringify({time:v.currentTime,width:v.videoWidth,state:v.readyState,error:$("stageError").hidden?"":$("stageError").textContent,media:v.error?.message,source:v.currentSrc.slice(0,24),mms:!!window.ManagedMediaSource}));
            },1000);
          },1000);''')
          p.write_text(s)
          PY
          xcodebuild -quiet -project ShunEntertainment.xcodeproj -scheme ShunEntertainment -sdk iphonesimulator -destination "id=$id" -derivedDataPath buildsim CODE_SIGNING_ALLOWED=NO build
          app=$(find buildsim/Build/Products -name ShunEntertainment.app | head -1)
          bundle=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          xcrun simctl install "$id" "$app"
          xcrun simctl launch "$id" "$bundle"
          data=$(xcrun simctl get_app_container "$id" "$bundle" data)
          for n in {1..40}; do
            sleep 2
            if [ -f "$data/Documents/dash-test.json" ]; then
              cat "$data/Documents/dash-test.json"
              if python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); sys.exit(not(d["time"]>0.2 and d["width"]>0))' "$data/Documents/dash-test.json"; then exit 0; fi
            fi
          done
          exit 1
