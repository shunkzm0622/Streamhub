name: Build Shun Native IPA
on:
  push:
    branches: [ios-native-swiftui]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Bundle native catalog
        run: cp iptv_channels_grouped.json App/Web/stations.json
      - name: Build Release for iPhone and iPad
        run: |
          xcodebuild -project ShunEntertainment.xcodeproj -scheme ShunEntertainment \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" CODE_SIGNING_ALLOWED=NO build
      - name: Package and verify unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          app=build/Build/Products/Release-iphoneos/ShunEntertainment.app
          test -s "$app/ShunEntertainment"
          test -s "$app/Web/stations.json"
          xcrun lipo "$app/ShunEntertainment" -verify_arch arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print :DTPlatformName' "$app/Info.plist")" = iphoneos
          mkdir -p package/Payload
          ditto "$app" package/Payload/ShunEntertainment.app
          (cd package && /usr/bin/zip -qry ../ShunNative-unsigned.ipa Payload)
          unzip -tq ShunNative-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ShunNative-unsigned-IPA
          path: ShunNative-unsigned.ipa
          if-no-files-found: error

      - name: Publish downloadable iOS build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="ios-native-$GITHUB_RUN_NUMBER"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" ShunNative-unsigned.ipa --clobber
          else
            gh release create "$tag" ShunNative-unsigned.ipa --target "$GITHUB_SHA" --title "Shun Native SwiftUI · Build $GITHUB_RUN_NUMBER" --notes "IPA chưa ký dành cho ESign hoặc Feather." --latest=false
          fi
