name: "Archived - Check VTV10 stream metadata"
on:
  workflow_dispatch:
permissions: {}
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Read stream response
        run: |
          python3 - <<'PY'
          import urllib.request as u
          from urllib.parse import urlsplit
          from urllib.error import HTTPError
          url='https://vmttv.dpdns.org/tv360/?id=vtv10'
          try:
              with u.urlopen(url,timeout=20) as r:
                  data=r.read(8192).decode(errors='replace').lstrip()
                  print('VTV10',r.status,r.headers.get_content_type(),urlsplit(r.url).hostname,'HLS',data.startswith('#EXTM3U'),'DASH','<MPD' in data,'HTML','<html' in data.lower(),'cors',r.headers.get('Access-Control-Allow-Origin'))
          except HTTPError as err:
              print('VTV10 HTTP',err.code,err.headers.get_content_type())
          PY